[package]
name = "solana-accountsdb-plugin-kafka"
description = "Solana AccountsDb plugin for Kafka"
authors = ["Blockdaemon", "Triton One", "Shyft"]
version = "0.6.0+solana.4.0"
edition = "2021"
repository = "https://github.com/Shyft-to/solana-accountsdb-plugin-kafka"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agave-geyser-plugin-interface = "4.2.0"
http = "1.4.0"
http-body-util = { version = "0.1.3", features = ["full"] }
hyper = { version = "1.4.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "server-auto", "tokio"] }
lazy_static = "1.4.0"
log = "0.4.0"
prometheus = "0.14.0"
prost = "0.14.0"
rdkafka = { version = "0.33.0", features = ["ssl", "sasl"] }
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.86"
solana-logger = "3.0.0"
solana-message = "4.4.1"
solana-pubkey = "4.2.0"
solana-transaction = "4.1.3"
solana-transaction-status = "4.2.0"
tokio = { version = "1.47.0", features = ["rt-multi-thread", "time", "macros", "net", "sync"] }

[build-dependencies]
anyhow = "1.0.98"
cargo-lock = "11.0.0"
git-version = "0.3.5"
prost-build = "0.12.1"
vergen = { version = "=9.0.6", features = ["build", "rustc" ] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
lto = true
codegen-units = 1
